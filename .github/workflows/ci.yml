name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # O app lê os CSVs versionados em data/app: os testes não precisam de banco.
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
